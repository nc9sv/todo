name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t taskboard-backend ./TaskBoard/backend

      - name: Build frontend Docker image
        run: docker build -t taskboard-frontend ./TaskBoard/frontend

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag taskboard-backend ghcr.io/${{ github.repository_owner }}/taskboard-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-backend:latest

      - name: Push frontend image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag taskboard-frontend ghcr.io/${{ github.repository_owner }}/taskboard-frontend:latest
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-frontend:latest
